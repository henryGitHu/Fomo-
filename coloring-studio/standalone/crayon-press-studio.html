<title>Crayon Press Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: sticky top bar (book + workflow tabs) over a two-column shell — the working view on the left,
   the docked Live Book Editor on the right (slide-over on narrow screens). Pages are drawn as paper sheets. */
:root{
  --paper:#F3F5F6; --sheet:#FFFFFF; --ink:#16212C; --ink-2:#4B5967; --line:#D3DAE0; --wash:#E9EDF0;
  --accent:#E9A21A; --accent-ink:#16212C; --cobalt:#2B57D0; --cobalt-wash:#E4EBFB;
  --good:#1D8657; --warn:#A86D12; --bad:#BF3B34; --good-wash:#E2F3EA; --warn-wash:#FBF0DC; --bad-wash:#FBE5E3;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px; --shadow:0 1px 2px rgba(22,33,44,.06), 0 4px 14px rgba(22,33,44,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0E1318; --sheet:#161D25; --ink:#E7ECF1; --ink-2:#9AA7B4; --line:#2A3540; --wash:#1D2630;
  --accent:#F2B634; --accent-ink:#141A20; --cobalt:#86A2FF; --cobalt-wash:#1E2A48;
  --good:#53C391; --warn:#E3B04B; --bad:#F07A70; --good-wash:#16302A; --warn-wash:#33291A; --bad-wash:#3A1F1F;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0E1318; --sheet:#161D25; --ink:#E7ECF1; --ink-2:#9AA7B4; --line:#2A3540; --wash:#1D2630;
  --accent:#F2B634; --accent-ink:#141A20; --cobalt:#86A2FF; --cobalt-wash:#1E2A48;
  --good:#53C391; --warn:#E3B04B; --bad:#F07A70; --good-wash:#16302A; --warn-wash:#33291A; --bad-wash:#3A1F1F;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--sheet)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:800;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.6rem} h2{font-size:1.15rem} h3{font-size:1rem}
a{color:var(--cobalt)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:.82rem}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--sheet);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.1rem;background:none;border:0;cursor:pointer;padding:0}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.book-name{font-family:var(--f-display);font-weight:600;color:var(--ink-2);max-width:32ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:2px;overflow-x:auto;min-width:0;flex:1 1 100%;scrollbar-width:thin}
.tab{border:0;background:none;padding:7px 11px;border-radius:8px;cursor:pointer;white-space:nowrap;color:var(--ink-2);font-weight:700;font-size:.9rem}
.tab:hover{background:var(--wash);color:var(--ink)}
.tab[aria-current="page"]{background:var(--ink);color:var(--sheet)}
.tab .step{font-family:var(--f-mono);font-size:.72rem;opacity:.7;margin-right:5px}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700;background:var(--wash);color:var(--ink-2);white-space:nowrap}
.pill.good{background:var(--good-wash);color:var(--good)} .pill.warn{background:var(--warn-wash);color:var(--warn)} .pill.bad{background:var(--bad-wash);color:var(--bad)} .pill.info{background:var(--cobalt-wash);color:var(--cobalt)}

/* shell */
.shell{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1600px;margin:0 auto}
.shell.no-chat{grid-template-columns:minmax(0,1fr)}
main{min-width:0;display:flex;flex-direction:column;gap:16px}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:12px}
.panel-head .spacer{min-width:8px}
.lead{max-width:68ch;margin:4px 0 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:700}
label.f span.h{font-weight:400;color:var(--ink-2);font-size:.78rem}
.in{width:100%;border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:7px 10px;font-weight:400}
textarea.in{resize:vertical;min-height:64px}
.check{display:flex;align-items:center;gap:8px;font-size:.9rem}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:7px 12px;font-weight:700;font-size:.88rem;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--wash)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(.95)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.note{border-left:3px solid var(--cobalt);background:var(--cobalt-wash);padding:8px 12px;border-radius:0 8px 8px 0;font-size:.88rem;max-width:80ch}
.note.warn{border-color:var(--warn);background:var(--warn-wash)}
.note.bad{border-color:var(--bad);background:var(--bad-wash)}
.bar{height:6px;background:var(--wash);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{text-align:left;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}

/* library */
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.book{display:flex;flex-direction:column;gap:8px}
.cover-thumb{aspect-ratio:8.5/11;max-width:100%;background:var(--sheet);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);display:grid;place-items:center;overflow:hidden;cursor:pointer;position:relative}
.cover-thumb img{width:100%;height:100%;object-fit:contain;background:#fff}
.cover-thumb .ph{font-family:var(--f-display);font-weight:800;color:var(--line);font-size:3rem}
.book h3{font-size:1rem}

/* studio */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--sheet);border-radius:99px;padding:3px 10px;font-size:.8rem;cursor:pointer;font-weight:700;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.sec-title{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;margin:6px 0 10px}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.pg{position:relative;display:flex;flex-direction:column;gap:6px;min-width:0}
.sheet{aspect-ratio:7.5/8.9;max-width:100%;background:#fff;border:1px solid var(--line);border-radius:3px;box-shadow:var(--shadow);display:grid;place-items:center;overflow:hidden;cursor:pointer;position:relative;padding:0}
.sheet img{width:100%;height:100%;object-fit:contain}
.sheet .empty{font-size:.78rem;color:#7a8794;padding:10px;text-align:center}
.sheet.gen::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(233,162,26,.25) 50%,transparent 70%);background-size:200% 100%;animation:sweep 1.2s linear infinite}
@keyframes sweep{from{background-position:120% 0}to{background-position:-80% 0}}
.pg .num{position:absolute;top:6px;left:6px;font-family:var(--f-mono);font-size:.7rem;background:rgba(255,255,255,.92);color:#16212C;border-radius:4px;padding:1px 5px;border:1px solid #D3DAE0}
.pg .lock{position:absolute;top:6px;right:32px;font-size:.75rem;background:#16212C;color:#fff;border-radius:4px;padding:1px 5px}
.pg .sel{position:absolute;top:6px;right:6px;width:18px;height:18px;margin:0}
.pg .t{font-size:.8rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg .meta{display:flex;justify-content:space-between;align-items:center;gap:4px}
.st{font-size:.7rem;font-weight:700;border-radius:99px;padding:1px 8px;white-space:nowrap}
.st-planned{background:var(--wash);color:var(--ink-2)} .st-queued,.st-generating{background:var(--cobalt-wash);color:var(--cobalt)}
.st-review{background:var(--warn-wash);color:var(--warn)} .st-revision,.st-failed{background:var(--bad-wash);color:var(--bad)}
.st-approved,.st-locked{background:var(--good-wash);color:var(--good)}
.queuebar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--cobalt-wash);border-radius:8px;padding:8px 12px;font-size:.88rem}

/* drawer */
.drawer-bg{position:fixed;inset:0;background:rgba(10,15,20,.45);z-index:50;display:flex;justify-content:flex-end}
.drawer{width:min(980px,100%);height:100%;background:var(--sheet);overflow-y:auto;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.detail{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.detail{grid-template-columns:1fr}}
.big{aspect-ratio:7.5/8.9;max-width:100%;background:#fff;border:1px solid var(--line);display:grid;place-items:center}
.big img{width:100%;height:100%;object-fit:contain}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:.86rem}
.checks li{display:flex;gap:8px}
.checks .i{width:18px;flex:none;font-weight:800;text-align:center}
.ok{color:var(--good)} .wn{color:var(--warn)} .fl{color:var(--bad)}
.revs{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.rev{flex:none;width:96px;font-size:.7rem;display:flex;flex-direction:column;gap:4px}
.rev .sheet{border-width:2px}
.rev.cur .sheet{border-color:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:.84rem}
.kv dt{color:var(--ink-2)} .kv dd{margin:0}

/* battle */
.contenders{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.cand{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:var(--r);padding:10px}
.cand.win{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.scores{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:.82rem}
.meter{height:5px;background:var(--wash);border-radius:9px;grid-column:1/-1;overflow:hidden;margin-bottom:4px}
.meter>i{display:block;height:100%;background:var(--cobalt)}

/* preview */
.spread{display:grid;grid-template-columns:1fr 1fr;background:var(--wash);padding:16px;border-radius:var(--r);gap:0;max-width:900px;margin:0 auto;width:100%}
.ppage{background:#fff;color:#16212C;aspect-ratio:8.5/11;max-width:100%;position:relative;box-shadow:var(--shadow);overflow:hidden}
.ppage .safe{position:absolute;border:1px dashed #9ec1e8}
.ppage .art{position:absolute;display:grid;place-items:center}
.ppage .art img{max-width:100%;max-height:100%;object-fit:contain}
.ppage .cap{position:absolute;text-align:center;font-size:clamp(6px,1.05vw,11px);line-height:1.3}
.ppage .pn{position:absolute;bottom:3%;width:100%;text-align:center;font-family:var(--f-mono);font-size:9px;color:#7a8794}
.ppage .fm{position:absolute;inset:12%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:6px}
.wrap-cover{display:flex;max-width:900px;width:100%;margin:0 auto;border-radius:4px;overflow:hidden;box-shadow:var(--shadow)}
.wrap-cover>div{display:grid;place-items:center;color:#fff;font-size:.78rem;text-align:center;padding:6px;min-width:0}

/* chat */
.chat{position:sticky;top:calc(env(safe-area-inset-top,0px) + 120px);height:calc(100vh - 150px);display:flex;flex-direction:column;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.chat-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:.88rem}
.m{padding:8px 11px;border-radius:10px;max-width:92%;white-space:pre-wrap;overflow-wrap:anywhere}
.m.u{align-self:flex-end;background:var(--cobalt-wash)}
.m.a{align-self:flex-start;background:var(--wash)}
.ex{display:block;width:100%;text-align:left;border:1px dashed var(--line);background:none;border-radius:8px;padding:6px 9px;cursor:pointer;font-size:.82rem;color:var(--ink-2)}
.ex:hover{border-style:solid;color:var(--ink)}
.chat form{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
.chat-fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:45}
@media (max-width:1000px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .chat{position:fixed;z-index:46;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));top:auto;height:min(70vh,560px);box-shadow:0 10px 40px rgba(0,0,0,.25)}
}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;width:min(560px,calc(100% - 32px))}
.t-msg{background:var(--ink);color:var(--sheet);padding:9px 14px;border-radius:9px;font-size:.88rem;box-shadow:var(--shadow)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--bad-wash);border-radius:8px;padding:8px 10px;font-size:.86rem}
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:center}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.hero-art{display:flex;gap:10px;justify-content:center}
.hero-art .sheet{width:30%;cursor:default}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--f-display);font-size:1.5rem}
</style>

<header class="top">
  <div class="top-in">
    <button class="brand" data-act="go" data-view="library" aria-label="Library">
      <span class="brand-mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></svg></span>
      Crayon Press Studio
    </button>
    <span class="book-name" id="bookName"></span>
    <span class="spacer"></span>
    <span id="storePill" class="pill">Connecting…</span>
    <span id="claudePill" class="pill">Claude artist: checking</span>
    <nav class="tabs" id="tabs" aria-label="Book workflow"></nav>
  </div>
</header>
<div class="shell" id="shell">
  <main id="view" aria-live="polite"></main>
  <aside class="chat" id="chat" aria-label="Live Book Editor" hidden></aside>
</div>
<button class="btn dark chat-fab" id="chatFab" data-act="chat-open" hidden>Live Book Editor</button>
<div id="drawer"></div>
<div id="toast" role="status"></div>

<script>
"use strict";
/* ============================================================ knowledge & constants */

function geometry(book){ const [w,h]=TRIMS[book.trim]; const n=book.pages.length||book.count; const pages=4+2*n; const kdpGutter=pages<=150?0.375:pages<=300?0.5:pages<=500?0.625:pages<=700?0.75:0.875; const gutter=Math.max(kdpGutter,0.5), out=0.5, top=0.5, bottom=0.5; return {w,h,pages,gutter,out,top,bottom,kdpGutter,artW:+(w-gutter-out).toFixed(3),artH:+(h-top-bottom-CAP_BAND).toFixed(3)}; }
function coverGeo(book){ const g=geometry(book); const spine=+(g.pages*SPINE[book.paper]).toFixed(4); return {w:g.w,h:g.h,spine,fullW:+(0.25+g.w*2+spine).toFixed(4),fullH:+(g.h+0.25).toFixed(4),spineText:g.pages>79,pages:g.pages}; }

/* ============================================================ generation queue */

/* ============================================================ history / undo */
const SNAP=["status","locked","cur","caption","captionStatus","subject","scene","lineScale"];

function setStatus(book,p,action){

  for(let i=0;i<th.length;i++){ const x=bx+(i%2)*(tw+60), yy=H*.38+Math.floor(i/2)*(tH*0.62+40); ctx.fillStyle="#fff"; ctx.fillRect(x,yy,tw,tH*0.6); await drawRev(ctx,curRev(th[i],book),x+10,yy+10,tw-20,tH*0.6-20,th[i].lineScale); }
  ctx.fillStyle="#fff"; const bxw=2*DPI, bxh=1.2*DPI; ctx.fillRect(spineX-safe-0.125*DPI-bxw,H-B-safe-0.125*DPI-bxh,bxw,bxh);
  const {jsPDF}=window.jspdf; const pdf=new jsPDF({unit:"in",format:[cg.fullW,cg.fullH],orientation:"landscape",compress:true});
  pdf.addImage(c.toDataURL("image/jpeg",0.93),"JPEG",0,0,cg.fullW,cg.fullH,undefined,"FAST");
  return pdf.output("blob");
}
async function offer(filename,data){
  if(!S.downloads){ toast("Downloads need this page opened in claude.ai."); return; }
  try{ await S.downloads.save({filename,data}); toast("Saved "+filename); }
  catch(e){ if(e.code==="declined") toast("Download cancelled."); else if(e.code==="rate_limited") toast("A download prompt is already open."); else toast("Couldn't save the file: "+(e.message||e.code)); }
}
const safeName=s=>(s||"book").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60)||"book";
async function doExport(kind){
  const book=S.book; if(S.exporting) return;
  S.exporting={kind,frac:0,msg:"Starting"}; render();
  try{
    if(kind==="proof"||kind==="interior"){ const r=await buildInterior(book,kind==="proof",(f,m)=>{S.exporting={kind,frac:f,msg:m}; renderExportBar();}); await offer(`${safeName(book.title)}-${kind==="proof"?"proof":"interior"}.pdf`,r.blob); }
    else if(kind==="cover"){ S.exporting.msg="Drawing the cover"; renderExportBar(); await offer(`${safeName(book.title)}-cover.pdf`,await buildCover(book)); }
    else if(kind==="backup"){ const art={}; book.pages.forEach(p=>art[p.id]=artOf(p.id,book)); await offer(`${safeName(book.title)}-project.json`,JSON.stringify({book,art},null,1)); }
  }catch(e){ toast("Export failed: "+(e.message||e)); }

function bookQA(book){
  const g=geometry(book), n=book.pages.length, cs=capSettings(book);
  const noArt=book.pages.filter(p=>!p.cur), notAppr=book.pages.filter(p=>!(p.locked||p.status==="approved")), qaFail=book.pages.filter(p=>p.cur&&!qaPassed(book,p));
  const capBad=cs.enabled?book.pages.filter(p=>!p.caption||p.captionStatus==="invalid"):[], capRev=cs.enabled?book.pages.filter(p=>p.captionStatus==="review"):[];
  const alloc=book.sections.reduce((a,s)=>a+s.count,0); const L=a=>a.slice(0,12).map(p=>pageNo(book,p)).join(", ")+(a.length>12?"…":"");
  return [
    {id:"Illustration count",ok:n>0&&alloc===n,mand:true,msg:`${n} pages planned; sections allocate ${alloc}`},
    {id:"KDP page count",ok:g.pages>=24&&g.pages<=828,mand:true,msg:`${g.pages} interior pages (KDP needs 24–828)`},
    {id:"Every page has artwork",ok:!noArt.length,mand:true,msg:noArt.length?`Missing on pages ${L(noArt)}`:"All illustrated"},
    {id:"Image checks",ok:!qaFail.length,mand:true,msg:qaFail.length?`Failing on pages ${L(qaFail)}`:"All pages pass the required image checks"},
    {id:"Every page approved",ok:!notAppr.length,mand:true,msg:notAppr.length?`${notAppr.length} not approved yet (${L(notAppr)})`:"All approved or locked"},
    {id:"Captions present and fit",ok:!capBad.length,mand:true,msg:capBad.length?`Fix pages ${L(capBad)}`:cs.enabled?"All captions fit the band":"Captions turned off"},
    {id:"Captions reviewed",ok:!capRev.length,mand:false,msg:capRev.length?`${capRev.length} flagged for review (approving a page counts as review)`:"Nothing flagged"},
    {id:"Margins",ok:g.gutter>=g.kdpGutter&&g.out>=0.25,mand:true,msg:`Gutter ${g.gutter} in (KDP minimum ${g.kdpGutter}), outside ${g.out} in`},
    {id:"Single-sided layout",ok:true,mand:true,msg:"Every illustration on a right-hand page with a blank back"},
    {id:"Fonts",ok:true,mand:true,msg:"Pages are 300 PPI images with text drawn in, so no fonts need embedding"},
    {id:"Publication approval",ok:!!book.publicationApproved,mand:true,msg:book.publicationApproved?"You approved this book for publication":"Tick the approval box below"},
  ];
}

  "q-pause"(){ pauseQueue(); }, "q-resume"(){ runQueue(); }, "q-cancel"(){ cancelQueue(); },
  filter(d){ S.filter=d.f; render(); },
  select(d,el){ el.checked?S.selected.add(d.id):S.selected.delete(d.id); render(); },
  bulk(d){ const b=S.book, ps=[...S.selected].map(id=>b.pages.find(p=>p.id===id)).filter(Boolean); if(d.a==="clear"){ S.selected.clear(); render(); return; }
    if(d.a==="redraw"){ const run=ps.filter(p=>!p.locked&&p.status!=="approved"); enqueue(b,run); toast(`Queued ${run.length} page(s); approved and locked pages were skipped.`); }
    else { let n=0; ps.forEach(p=>{ if(setStatus(b,p,d.a)) n++; }); toast(`${n} page(s) updated.`); } S.selected.clear(); render(); },
  page(d){ S.openPage=d.id; render(); }, "close-drawer"(d,el,e){ if(e.target.closest("[data-stop]")&&!el.matches("button")) return; S.openPage=null; render(); },
  pa(d){ const b=S.book, p=b.pages.find(x=>x.id===S.openPage); setStatus(b,p,d.a); render(); },
  redraw(){ const b=S.book, p=b.pages.find(x=>x.id===S.openPage); enqueue(b,[p],$("#redrawEngine").value); toast(`Page ${pageNo(b,p)} queued.`); },
  lw(d){ const b=S.book, p=b.pages.find(x=>x.id===S.openPage); lineWeight(b,p,+d.d); render(); },
  restore(d){ const b=S.book, p=b.pages.find(x=>x.id===S.openPage); if(p.locked) return; remember(b,p,"restore"); p.cur=d.rev; p.status="review"; p.version++; save(b); render(); },
  "pd-save"(){ const b=S.book, p=b.pages.find(x=>x.id===S.openPage); if(p.locked) return; const subj=$("#pdSubject").value.trim(), scene=$("#pdScene").value.trim(), cap=$("#pdCaption").value.trim(); remember(b,p,"edit text");
    if(subj&&(subj!==p.subject||scene!==p.scene)){ p.subject=subj; p.scene=scene||subj; p.verified=false; if(p.cur){ p.status="revision"; } if(p.captionStatus==="ok") p.captionStatus="review"; }
    if(cap!==p.caption) setCaption(b,p,cap,true); p.version++; save(b); render(); toast("Saved."); },
  "battle-eng"(d,el){ el.checked?S.battleSel.add(d.e):S.battleSel.delete(d.e); render(); },
  "battle-run"(){ const b=S.book, p=b.pages.find(x=>x.id===S.battlePage); if(p) runBattle(b,p,[...S.battleSel]); },
  winner(d){ const b=S.book, p=b.pages.find(x=>x.id===S.battlePage); pickWinner(b,p,d.rev,false); },
  "winner-yes"(){ const b=S.book, c=S.confirm, p=b.pages.find(x=>x.id===c.pid); pickWinner(b,p,c.rev,true); },
  "cap-save"(d){ const b=S.book, p=b.pages.find(x=>x.id===d.id), t=document.querySelector(`[data-capedit="${d.id}"]`).value.trim(); if(p.locked) return; remember(b,p,"caption"); const r=setCaption(b,p,t,true); save(b); render(); toast(r.passed?"Caption saved.":"Saved, but it doesn't fit the caption band."); },
  async "cap-rewrite"(d){ const b=S.book, p=b.pages.find(x=>x.id===d.id); if(p.locked) return; remember(b,p,"caption"); setCaption(b,p,await rewriteCaption(b,p,""),false); save(b); render(); },
  "cap-all"(){ const b=S.book; b.pages.filter(p=>!p.locked).forEach(p=>{remember(b,p,"caption"); composeCaption(b,p);}); save(b); render(); toast("Captions rewritten from the planned facts."); },
  spread(d){ S.previewSpread=Math.max(0,S.previewSpread+ +d.d); render(); },
  "pub-approve"(d,el){ S.book.publicationApproved=el.checked; save(); render(); },
  export(d){ doExport(d.k); },
  "chat-open"(){ S.chatOpen=true; lsSet("cps:chat","1"); render(); }, "chat-close"(){ S.chatOpen=false; lsSet("cps:chat","0"); render(); },
  "chat-ex"(d,el){ sendChat(d.t||el.textContent); },
};
async function sendChat(text){ if(!text.trim()||S.chatBusy) return; S.chatBusy=true; render(); try{ await handleChat(text.trim()); }catch(e){ toast("Editor error: "+(e.message||e)); } S.chatBusy=false; render(); $("#chatIn")?.focus(); }
document.addEventListener("click",e=>{ const el=e.target.closest("[data-act]"); if(!el) return; const act=el.dataset.act; if(el.tagName==="A") e.preventDefault(); if(act==="close-drawer"&&el.classList.contains("drawer-bg")&&e.target!==el) return; A[act]?.(el.dataset,el,e); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&S.openPage){ S.openPage=null; render(); } if(e.key==="Enter"&&e.target.matches(".cover-thumb")) e.target.click(); });
document.addEventListener("submit",e=>{ e.preventDefault(); if(e.target.id==="newForm"){ const v=id=>$("#"+id).value.trim(); const b=newBook({title:v("nf-title"),subtitle:v("nf-subtitle"),author:v("nf-author"),theme:v("nf-theme"),age:v("nf-age"),count:v("nf-count"),trim:v("nf-trim"),paper:v("nf-paper"),engine:v("nf-engine"),style:v("nf-style")}); b.research=offlineResearch(b); save(b); S.newOpen=false; openBook(b.id); }
  if(e.target.id==="chatForm"){ const i=$("#chatIn"); const t=i.value; i.value=""; sendChat(t); } });
document.addEventListener("change",e=>{ const el=e.target, b=S.book; if(!b) return;
  if(el.dataset.bind){ const k=el.dataset.bind; b[k]=k==="batch"?+el.value:el.value; if(k==="theme"&&!b.pages.length) b.research=null; save(b); if(["trim","paper","engine","batch"].includes(k)) render(); else $("#bookName").textContent=b.title; }
  else if(el.dataset.sec!==undefined){ const s=b.sections[+el.dataset.sec], k=el.dataset.k; if(k==="count"){ const err=setSectionCount(b,s,clamp(+el.value||1,1,200)); if(err) toast(err); save(b); render(); } else { s[k]=el.value; save(b); } }
  else if(el.dataset.cap){ b.captions=b.captions||{}; const k=el.dataset.cap; b.captions[k]=el.type==="checkbox"?el.checked:(k==="fontPt"?+el.value:el.value); b.pages.forEach(p=>{ if(p.caption) setCaption(b,p,p.caption,p.captionStatus==="ok"); }); save(b); render(); }
  else if(el.id==="battlePage"){ S.battlePage=el.value||null; render(); } });
window.addEventListener("resize",()=>{ clearTimeout(window.__rz); window.__rz=setTimeout(render,150); });

/* ============================================================ boot */
async function boot(){
  S.chatOpen=lsGet("cps:chat")!=="0"; render(); drawHero();
  const use=n=>(window.claude&&window.claude.use)?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  const timer=setTimeout(()=>{ if(S.loading){ S.loading=false; setStorePill(); render(); drawHero(); } },10000);
  const [db,user,sample,downloads]=await Promise.all(["db","user","sample","downloads"].map(use));
  S.sample=sample; S.downloads=downloads;
  if(db&&user){ try{ const id=await user.id(); if(id){ S.db=db; S.uid=id; S.store="db"; } }catch{} }
  if(S.store!=="db"){ S.store=lsSet("cps:probe","1")?"local":"memory"; }
  try{ S.library=(await Store.listBooks()).filter(b=>b&&b.kind==="book"); }catch(e){ toast("Couldn't load your library: "+(e.message||e.code)); S.library=[]; }
  clearTimeout(timer); S.loading=false; setStorePill();
  await Promise.all(S.library.map(async b=>{ const first=b.pages.find(p=>p.cur); if(first){ S.art[b.id]=S.art[b.id]||await Store.loadArt(b.id).catch(()=>({})); } }));
  render(); drawHero();
}
function setStorePill(){ const p=$("#storePill"); const m={db:["good","Saved to your account"],local:["warn","Saved in this browser only"],memory:["bad","Not saved: storage unavailable"]}[S.store]; p.className="pill "+m[0]; p.textContent=m[1];
  const c=$("#claudePill"); c.className="pill "+(S.sample?"info":"warn"); c.textContent=S.sample?"Claude artist ready":"Claude artist off (sketch only)"; }
const _render=render; render=function(){ _render(); if(S.view==="library") drawHero(); };
boot();
</script>
