# =====================================================================
#  Crypto Momentum Scanner - settings
# =====================================================================
#  This is the ONLY file you need to edit to change how the scanner
#  behaves. Secrets (bot tokens, API keys) go in the separate `.env`
#  file, never here.
#
#  Tips for editing:
#   - Keep the indentation (spaces, not tabs). YAML cares about it.
#   - Text after a # is a comment and is ignored.
#   - true / false switch things on and off.
#   - After saving, close and re-open run.bat for changes to take effect.
#
#  IMPORTANT: this tool never places trades. It only watches and reports.
# =====================================================================


# ---------------------------------------------------------------------
# CHAINS - which blockchains to watch.
# ---------------------------------------------------------------------
# To stop watching a chain, set `enabled: false` (or delete its block).
# To add a chain, copy a block and fill in the IDs:
#   dexscreener_id    -> the chain name DexScreener uses in its URLs
#                        (e.g. dexscreener.com/<dexscreener_id>/...)
#   geckoterminal_id  -> the network name GeckoTerminal uses in its URLs
#                        (e.g. geckoterminal.com/<geckoterminal_id>/pools/...)
#   type              -> "solana" or "evm" (decides which safety checks
#                        run; Ethereum-style chains are "evm")
#   chain_id          -> EVM chains only: the chain's standard number
#                        (see chainlist.org). Needed for the safety checks.
# Leave an ID blank ("") if that site doesn't support the chain.
chains:
  - name: Solana
    enabled: true
    type: solana
    dexscreener_id: solana
    geckoterminal_id: solana

  - name: Ethereum
    enabled: true
    type: evm
    dexscreener_id: ethereum
    geckoterminal_id: eth
    chain_id: 1

  - name: Base
    enabled: true
    type: evm
    dexscreener_id: base
    geckoterminal_id: base
    chain_id: 8453

  - name: BNB Chain
    enabled: true
    type: evm
    dexscreener_id: bsc
    geckoterminal_id: bsc
    chain_id: 56

  - name: Arbitrum
    enabled: true
    type: evm
    dexscreener_id: arbitrum
    geckoterminal_id: arbitrum
    chain_id: 42161


# ---------------------------------------------------------------------
# SCAN LOOP - how often and how widely to look.
# ---------------------------------------------------------------------
scan:
  # Seconds to wait between scans. Each scan makes ~15-25 web requests,
  # so going much below 60 just runs into the free rate limits.
  interval_seconds: 90

  # Most tokens to snapshot per chain in one scan. Higher = wider net,
  # but more requests and a slower scan.
  max_candidates_per_chain: 60

  # Keep re-checking a token for this many minutes after it drops off
  # the trending/boosted lists. This builds the price/volume history
  # that the momentum score needs to spot acceleration.
  candidate_memory_minutes: 120


# ---------------------------------------------------------------------
# DATA SOURCES - free public market-data feeds.
# ---------------------------------------------------------------------
sources:
  dexscreener:
    # Master switch for DexScreener.
    enabled: true
    # Tokens that someone just paid to "boost" (promote) on DexScreener.
    use_boosts_latest: true
    # Tokens with the most active boosts right now.
    use_boosts_top: true
    # Tokens that just set up a DexScreener profile (often brand new).
    use_token_profiles: true
    # Speed limits we stay under. DexScreener's published limits are
    # 60/min for the boost/profile lists and 300/min for pair data.
    # We default a bit lower to be polite. Don't raise these above
    # the official limits.
    requests_per_minute_discovery: 50
    requests_per_minute_pairs: 250

  geckoterminal:
    # Master switch for GeckoTerminal.
    enabled: true
    # Pools GeckoTerminal marks as trending on each chain.
    use_trending: true
    # Newly created pools on each chain.
    use_new_pools: true
    # How many pages (20 pools each) to pull from each list, per chain.
    pages: 1
    # GeckoTerminal's free public limit is 30 requests/minute.
    # Keep this below 30.
    requests_per_minute: 25


# ---------------------------------------------------------------------
# BASIC FILTERS - tokens failing these are ignored.
# ---------------------------------------------------------------------
# These are the first hard gates from the spec. Phase 2 adds the
# contract-safety checks on top.
filters:
  # Minimum money in the trading pool (USD). Thin pools are easy to
  # manipulate and expensive to trade.
  min_liquidity_usd: 25000
  # Minimum trading volume over the last hour (USD).
  min_volume_1h_usd: 50000
  # Ignore pools younger than this many minutes (the first minutes of a
  # launch are chaos and prime rug territory).
  min_pair_age_minutes: 10


# ---------------------------------------------------------------------
# SAFETY CHECKS - hard gates. A token that FAILS any of these is never
# alerted. If a check can't be completed (a site is down, no data), the
# token is marked UNVERIFIED instead of quietly passing.
# ---------------------------------------------------------------------
safety:
  # Master switch. false = skip all safety checks (not recommended).
  enabled: true

  # Checks take time and have rate limits, so each scan only checks the
  # highest-momentum tokens that passed the basic filters, up to this many.
  # Results are remembered (below), so later scans check new tokens.
  max_checks_per_scan: 10

  # How long to trust a result before checking the token again (minutes).
  recheck_minutes_pass: 60
  recheck_minutes_fail: 360
  recheck_minutes_unverified: 15

  # true = hide tokens that FAILED safety from the top-movers table.
  hide_failed: true

  # Some data (top holders, LP lock) isn't always available. With
  # strict_mode: false, missing holder/LP data is noted but doesn't make a
  # token UNVERIFIED. With true, any missing data means UNVERIFIED.
  strict_mode: false

  # Largest share (percent) of the supply the top 10 wallets may hold,
  # NOT counting the trading pool itself or burn addresses.
  max_top10_holders_pct: 40

  solana:
    # The creator can still print new tokens -> fail.
    require_mint_authority_revoked: true
    # The creator can still freeze your tokens so you can't sell -> fail.
    require_freeze_authority_revoked: true
    # Minimum percent of the pool's liquidity tokens that must be burned or
    # locked (so the creator can't pull the liquidity). 0 = don't check.
    min_lp_locked_pct: 80
    # Also fail on any other "danger"-level warning from RugCheck
    # (e.g. dangerous Token-2022 features, the token being flagged as rugged).
    fail_on_rugcheck_danger: true
    # Free public Solana server, used if RugCheck is unavailable.
    rpc_url: https://api.mainnet-beta.solana.com
    # Speed limits (requests per minute) for RugCheck and the Solana server.
    rugcheck_requests_per_minute: 15
    rpc_requests_per_minute: 30

  evm:
    # Maximum buy and sell tax, in percent.
    max_buy_tax_pct: 10
    max_sell_tax_pct: 10
    # Fail if the contract's source code isn't published (can't be checked).
    fail_if_not_open_source: true
    # Fail if the owner still controls dangerous functions: minting new
    # tokens, blacklisting wallets, pausing trading, changing taxes, or
    # hidden/reclaimable ownership.
    fail_on_owner_privileges: true
    # Use honeypot.is as a second opinion on honeypot + taxes.
    use_honeypot_is: true
    # Speed limits. GoPlus's free limit is 30/min; keep below it.
    goplus_requests_per_minute: 20
    honeypot_is_requests_per_minute: 20


# ---------------------------------------------------------------------
# MOMENTUM SCORE - how "accelerating" a token looks (0-100).
# ---------------------------------------------------------------------
# Momentum = speeding up, not just "big". A token doing steady high
# volume scores low; a token whose volume is suddenly jumping scores high.
momentum:
  # How much each part counts. They are re-scaled to add up to 1.
  weights:
    volume_acceleration: 0.40   # last 5 min volume vs its recent normal
    buy_pressure: 0.30          # buys outnumbering sells
    price_trend: 0.30           # price up over both 5 min and 1 hour

  # "Recent normal" volume is averaged over this many minutes of our own
  # stored history (falls back to DexScreener's 1h/6h figures when we
  # don't have enough history yet).
  baseline_minutes: 60
  # Volume running this many times faster than normal = full marks.
  volume_acceleration_full_score_ratio: 3.0

  # Share of transactions that are buys needed for full marks
  # (0.5 = even; 0.70 = 70% buys).
  buy_ratio_full_score: 0.70

  # 1-hour price rise (percent) that earns full marks for price trend.
  price_change_1h_full_score_pct: 30

  # "Single giant candle" guard: a pump that happened all at once is
  # riskier than a steady climb. If the 5-minute rise is bigger than
  # giant_candle_pct_5m, OR it makes up more than giant_candle_share_of_1h
  # of the whole 1-hour rise, the momentum score is multiplied by
  # giant_candle_penalty (0.5 = cut in half).
  giant_candle_pct_5m: 25
  giant_candle_share_of_1h: 0.8
  giant_candle_penalty: 0.5


# ---------------------------------------------------------------------
# COMBINED SCORE (0-100) - what decides whether you get an alert.
# ---------------------------------------------------------------------
scoring:
  # How much each part counts. They are re-scaled to add up to 1.
  # "social" (Reddit/Telegram buzz) arrives in phases 5-6. Until a social
  # source is switched on, its weight is simply left out.
  weights:
    momentum: 0.60   # the momentum score above
    social: 0.20     # how fast mentions are accelerating
    safety: 0.20     # how comfortably the token cleared the safety gates
  # Tokens marked UNVERIFIED get their safety part multiplied by this
  # (0.5 = counts half), so they need stronger momentum to alert.
  unverified_safety_multiplier: 0.5


# ---------------------------------------------------------------------
# ALERTS - messages to your phone (Telegram) and/or Discord.
# ---------------------------------------------------------------------
# Tokens that FAIL safety are never alerted, whatever their score.
alerts:
  # true = send an alert the moment a token crosses the threshold.
  # false = no instant alerts (you'll still get the hourly digest below).
  instant: true
  # Send an alert when the combined score reaches this (0-100).
  score_threshold: 70
  # After alerting on a token, stay quiet about it for this many minutes...
  cooldown_minutes: 60
  # ...unless its score rises by at least this many points again.
  realert_score_jump: 15
  # true = also alert on UNVERIFIED tokens (clearly marked as such).
  # false = only alert on tokens that passed every safety check.
  send_unverified: true
  # Most alerts to send in one scan (the highest scores go first).
  max_alerts_per_scan: 3
  # Where to send them. Telegram needs TELEGRAM_BOT_TOKEN and
  # TELEGRAM_CHAT_ID in .env; Discord needs DISCORD_WEBHOOK_URL.
  telegram: true
  discord: false


# ---------------------------------------------------------------------
# SCHEDULED SUMMARIES - regular messages to Telegram/Discord.
# ---------------------------------------------------------------------
summaries:
  # Hourly(ish) digest of the best tokens right now, even if none crossed
  # the alert threshold.
  digest: true
  digest_every_minutes: 60
  # How many tokens to list in the digest.
  digest_top_n: 5

  # Paper-trade results for today as a chart image (running profit/loss
  # and each trade's win or loss), sent every few hours...
  pnl_chart: true
  pnl_every_hours: 2
  # ...plus an end-of-day summary at this time on the PC's clock
  # (24-hour "HH:MM", e.g. "21:00"). Use "" to turn it off.
  pnl_daily_time: "21:00"


# ---------------------------------------------------------------------
# SUGGESTED TRADE - included in every alert. Only a suggestion: this
# tool never places trades.
# ---------------------------------------------------------------------
trade:
  # Suggested position size in US dollars.
  position_usd: 50
  # Take profit this many percent above the entry price.
  take_profit_pct: 15
  # Stop loss this many percent below the entry price.
  stop_loss_pct: 8
  # Assumed exchange + network fees for buying AND selling, in percent.
  round_trip_fee_pct: 1.0
  # Warn in the alert when estimated costs (fees + slippage) would eat
  # more than this percent of the take-profit gain.
  warn_if_costs_exceed_pct_of_tp: 50


# ---------------------------------------------------------------------
# CONSOLE DISPLAY
# ---------------------------------------------------------------------
display:
  # How many top movers to print after each scan.
  top_n: 15
  # true = only list tokens that pass the basic filters above.
  # false = list everything (failing rows are marked).
  only_passing_filters: true


# ---------------------------------------------------------------------
# STORAGE - the local database file.
# ---------------------------------------------------------------------
storage:
  # Where the SQLite database lives (relative to this folder).
  database_path: data/scanner.db
  # Delete price snapshots older than this many days to keep the file
  # small. (Alerts and paper-trade results are never auto-deleted.)
  keep_snapshots_days: 14


# ---------------------------------------------------------------------
# NETWORK
# ---------------------------------------------------------------------
network:
  # Give up on a single request after this many seconds.
  timeout_seconds: 20
  # Retries after a failed request (with growing waits between tries).
  max_retries: 4


# ---------------------------------------------------------------------
# LOGGING
# ---------------------------------------------------------------------
logging:
  # Log file location. It rotates: when it reaches max_file_mb, it is
  # renamed and a fresh one starts, keeping backup_count old copies.
  log_file: logs/scanner.log
  max_file_mb: 5
  backup_count: 5
  # How chatty the log is: DEBUG, INFO, WARNING, or ERROR.
  level: INFO
